name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/budget-web/**"
      - "packages/budget-shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/get-volta-node-version
        id: volta
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.volta.outputs.node-version }}
          cache: pnpm
      # The web package postinstall generates public/licenses.html.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @budget/web run test
      - run: pnpm --filter @budget/web run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/budget-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
